<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal del Voluntariado | Cadena de Favores Venezuela</title>
  
  <!-- Favicons -->
  <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">

  <!-- Estilos y Frameworks -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
  <link rel="stylesheet" href="../styles.css">

  <style>
    :root {
      --brand-blue: #1E3A8A;
      --brand-green: #86C232;
      --brand-purple: #6c5ce7;
    }
    body {
      background-color: #f8fafc;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }
    .bg-custom-brand {
      background-color: var(--brand-blue) !important;
    }
    .brand-logo {
      height: 42px;
      width: auto;
      border-radius: 50%;
      background-color: white;
      padding: 2px;
    }
    .letter-spacing-2 {
      letter-spacing: 0.35rem;
      font-weight: bold;
    }
    /* Estilos del Calendario Operativo */
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      background-color: #cbd5e1;
      gap: 1px;
      border-radius: 8px;
      overflow: hidden;
    }
    .calendar-header-day {
      background-color: #f1f5f9;
      text-align: center;
      padding: 10px 0;
      font-weight: 700;
      color: #475569;
      font-size: 0.85rem;
    }
    .calendar-day {
      background-color: #fff;
      min-height: 110px;
      padding: 6px;
      position: relative;
    }
    .calendar-day:hover {
      background-color: #f8fafc;
    }
    .calendar-day-number {
      font-size: 0.8rem;
      font-weight: 600;
      color: #64748b;
    }
    .guardia-badge {
      display: block;
      margin-top: 4px;
      border-radius: 4px;
      padding: 4px 6px;
      color: white;
      font-size: 0.75rem;
      cursor: pointer;
      text-decoration: none;
    }
    .guardia-badge:hover { opacity: 0.9; }
    .guardia-disponible { background-color: #22c55e; }
    .guardia-llena { background-color: #ef4444; }
    .guardia-mi-asignacion { background-color: #3b82f6; }
  </style>
</head>
<body class="d-flex flex-column min-vh-100">

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-custom-brand shadow-sm">
    <div class="container d-flex justify-content-between align-items-center">
      <a class="navbar-brand d-flex align-items-center" href="/">
        <img src="../assets/logo.jpg" alt="Logo Cadena de Favores" class="brand-logo me-2">
        <span class="fw-bold">Cadena de Favores <small class="text-warning">Vzla</small></span>
      </a>
      <div id="navUserMenu"></div>
    </div>
  </nav>

  <!-- CONTENEDOR PRINCIPAL DINO/SPA -->
  <main id="appContainer" class="container my-4 flex-grow-1"></main>

  <!-- FOOTER -->
  <footer class="bg-dark text-white text-center py-3 mt-auto w-100">
    <div class="container small">
      <p class="mb-1 text-white-50">&copy; 2026 Cadena de Favores Vzla. Todos los derechos reservados.</p>
      <a href="javascript:void(0)" class="text-warning text-decoration-none fw-semibold" onclick="verPoliticasIndependientes()">
        <i class="fa-solid fa-file-contract me-1"></i> Políticas de Privacidad y Tratamiento de Datos
      </a>
    </div>
  </footer>

  <!-- MODAL GENERAL OPERATIVO -->
  <div class="modal fade" id="modalGuardia" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow">
        <div class="modal-header bg-custom-brand text-white">
          <h5 class="modal-title" id="modalGuardiaTitulo"><i class="fa-solid fa-clock me-2"></i>Detalles Operativos</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="modalGuardiaBody"></div>
        <div class="modal-footer bg-light" id="modalGuardiaFooter">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="api.js"></script>

  <script>
    // Estado Global de la Sesión
    let sesionUsuario = JSON.parse(sessionStorage.getItem('userProfile')) || null;

    window.onload = function() {
      actualizarNavMenu();
      if (!sesionUsuario) {
        cargarVista('auth');
      } else {
        cargarVista('perfil');
      }
    };

    function actualizarNavMenu() {
      const container = document.getElementById('navUserMenu');
      if (!container) return;

      if (sesionUsuario) {
        container.innerHTML = `
          <div class="dropdown">
            <button class="btn btn-outline-light btn-sm dropdown-toggle fw-semibold" type="button" data-bs-toggle="dropdown">
              <i class="fa-solid fa-user-circle me-1"></i> ${sesionUsuario.nombre || sesionUsuario.email}
            </button>
            <ul class="dropdown-menu dropdown-menu-end shadow">
              <li><a class="dropdown-item" href="javascript:void(0)" onclick="cargarVista('perfil')"><i class="fa-solid fa-id-card me-2 text-primary"></i>Mi Perfil</a></li>
              <li><a class="dropdown-item" href="javascript:void(0)" onclick="cargarVista('calendario')"><i class="fa-solid fa-calendar-days me-2 text-success"></i>Calendario de Guardias</a></li>
              <li><hr class="dropdown-divider"></li>
              <li><a class="dropdown-item text-danger" href="javascript:void(0)" onclick="cerrarSesion()"><i class="fa-solid fa-right-from-bracket me-2"></i>Cerrar Sesión</a></li>
            </ul>
          </div>
        `;
      } else {
        container.innerHTML = `<span class="badge bg-warning text-dark fw-bold">Portal Público</span>`;
      }
    }

    /**
     * Enrutador Principal
     */
    function cargarVista(vista) {
      sesionUsuario = JSON.parse(sessionStorage.getItem('userProfile')) || null;
      actualizarNavMenu();
      const container = document.getElementById('appContainer');
      if (!container) return;

      switch(vista) {
        case 'auth':
          renderizarVistaAuth(container);
          break;
        case 'registro':
          renderizarVistaRegistro(container);
          break;
        case 'perfil':
          renderizarVistaPerfil(container);
          break;
        case 'calendario':
          renderizarVistaCalendario(container);
          break;
        default:
          renderizarVistaAuth(container);
      }
    }

    /* ==========================================================================
       VISTA 1: AUTH / LOGIN CON OTP
       ========================================================================== */
    function renderizarVistaAuth(container) {
      container.innerHTML = `
        <div class="row justify-content-center">
          <div class="col-12 col-md-5">
            <div class="card shadow-lg border-0 mt-3 animate__animated animate__fadeIn">
              <div class="card-body p-4">
                <h4 class="text-center mb-3 text-primary fw-bold">Acceso al Sistema</h4>
                
                <div class="d-flex justify-content-center mb-4">
                  <div class="btn-group w-100 shadow-sm" role="group">
                    <input type="radio" class="btn-check" name="btnRol" id="rolEslabon" checked value="eslabon">
                    <label class="btn btn-outline-primary py-2 fw-bold" for="rolEslabon"><i class="fa-solid fa-link me-2"></i>Eslabón</label>
                    <input type="radio" class="btn-check" name="btnRol" id="rolCoordinador" value="coordinador">
                    <label class="btn btn-outline-primary py-2 fw-bold" for="rolCoordinador"><i class="fa-solid fa-user-shield me-2"></i>Coordinador</label>
                  </div>
                </div>

                <div id="loginErrorMsg" class="alert alert-danger small py-2 d-none"></div>

                <div id="authStep1">
                  <div class="mb-3">
                    <label class="form-label fw-bold small">Correo Electrónico</label>
                    <input type="email" class="form-control form-control-lg" id="loginEmail" placeholder="usuario@dominio.com" required>
                  </div>
                  <button class="btn btn-primary w-100 py-2 fw-bold" id="btnContinuarEmail" onclick="procesarVerificacionInicial()">Continuar</button>
                </div>

                <div id="authStepOTP" class="d-none">
                  <div class="alert alert-info small py-2">
                    <i class="fa-solid fa-envelope-circle-check me-2"></i> Código enviado a su correo.
                  </div>
                  <div class="mb-3">
                    <label class="form-label fw-bold small text-center d-block">Ingrese el código de 6 dígitos</label>
                    <input type="text" class="form-control form-control-lg text-center letter-spacing-2 font-monospace" id="loginOTP" maxlength="6" placeholder="------">
                  </div>
                  <button class="btn btn-success w-100 py-2 fw-bold" id="btnConfirmOTP" onclick="validarYAccederOTP()">Confirmar e Iniciar Sesión</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    async function procesarVerificacionInicial() {
      const email = document.getElementById('loginEmail').value.trim();
      const rol = document.querySelector('input[name="btnRol"]:checked').value;
      const btn = document.getElementById('btnContinuarEmail');
      const errorDiv = document.getElementById('loginErrorMsg');

      if (!email) {
        errorDiv.innerText = "El correo electrónico es obligatorio.";
        errorDiv.classList.remove('d-none');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Verificando...';

      const res = await callBackend("verificarEmail", { email: email, rol: rol });
      btn.disabled = false;
      btn.innerText = "Continuar";

      if (res.status === "EXISTENTE") {
        const otpRes = await callBackend("enviarOTP", { email: email });
        if (otpRes.status !== "ERROR") {
          document.getElementById('authStep1').classList.add('d-none');
          document.getElementById('authStepOTP').classList.remove('d-none');
        } else {
          errorDiv.innerText = otpRes.message;
          errorDiv.classList.remove('d-none');
        }
      } else if (res.status === "NUEVO") {
        // Redirigir a registro completo
        sessionStorage.setItem('tempEmailRegistration', email);
        cargarVista('registro');
      } else {
        errorDiv.innerText = res.message || "Error al validar la cuenta.";
        errorDiv.classList.remove('d-none');
      }
    }

    async function validarYAccederOTP() {
      const email = document.getElementById('loginEmail').value.trim();
      const otp = document.getElementById('loginOTP').value.trim();
      const rol = document.querySelector('input[name="btnRol"]:checked').value;
      const btn = document.getElementById('btnConfirmOTP');
      const errorDiv = document.getElementById('loginErrorMsg');

      if (!otp || otp.length < 6) {
        errorDiv.innerText = "Ingrese el código de 6 dígitos.";
        errorDiv.classList.remove('d-none');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Validando...';

      const res = await callBackend("validarOTP", { email: email, otp: otp, rol: rol });
      
      if (res.status === "SUCCESS") {
        const perfil = res.perfil || { email: email, nombre: "Voluntario Activo" };
        perfil.rolActivo = rol;
        sessionStorage.setItem('userProfile', JSON.stringify(perfil));
        cargarVista('perfil');
      } else {
        btn.disabled = false;
        btn.innerText = "Confirmar e Iniciar Sesión";
        errorDiv.innerText = res.message || "Código incorrecto o vencido.";
        errorDiv.classList.remove('d-none');
      }
    }

    /* ==========================================================================
       VISTA 2: FORMULARIO DE REGISTRO COMPLETO
       ========================================================================== */
    function renderizarVistaRegistro(container) {
      const preEmail = sessionStorage.getItem('tempEmailRegistration') || '';
      container.innerHTML = `
        <div class="row justify-content-center animate__animated animate__fadeIn">
          <div class="col-12 col-md-8">
            <div class="card shadow border-0">
              <div class="card-header bg-custom-brand text-white py-3">
                <h5 class="mb-0 fw-bold"><i class="fa-solid fa-user-plus me-2"></i>Inscripción de Nuevo Voluntario</h5>
              </div>
              <div class="card-body p-4">
                <form id="formRegistroVoluntario" onsubmit="guardarRegistroVoluntario(event)">
                  <div class="row">
                    <div class="col-md-6 mb-3">
                      <label class="form-label fw-bold small">Nombre Completo *</label>
                      <input type="text" class="form-control" id="regNombre" required>
                    </div>
                    <div class="col-md-6 mb-3">
                      <label class="form-label fw-bold small">Correo Electrónico *</label>
                      <input type="email" class="form-control" id="regEmail" value="${preEmail}" required>
                    </div>
                  </div>
                  <div class="row">
                    <div class="col-md-6 mb-3">
                      <label class="form-label fw-bold small">Teléfono / WhatsApp *</label>
                      <input type="tel" class="form-control" id="regTelefono" placeholder="04141234567" required>
                    </div>
                    <div class="col-md-6 mb-3">
                      <label class="form-label fw-bold small">Especialidad / Profesión *</label>
                      <select class="form-select" id="regEspecialidad" required>
                        <option value="">Seleccione...</option>
                        <option value="Médico">Médico / Área de Salud</option>
                        <option value="Paramédico">Paramédico / Socorrista</option>
                        <option value="Logística">Logística / Transporte</option>
                        <option value="Legal">Asesoría Legal</option>
                        <option value="Apoyo General">Apoyo General / Operaciones</option>
                      </select>
                    </div>
                  </div>
                  <div class="mb-3">
                    <label class="form-label fw-bold small">Ciudad o Zona de Residencia</label>
                    <input type="text" class="form-control" id="regUbicacion" placeholder="Ej. Valencia, Naguanagua, Guacara">
                  </div>

                  <div id="regErrorMsg" class="alert alert-danger small d-none"></div>

                  <div class="d-flex justify-content-between align-items-center mt-4">
                    <button type="button" class="btn btn-outline-secondary" onclick="cargarVista('auth')">Cancelar</button>
                    <button type="submit" class="btn btn-success fw-bold px-4" id="btnGuardarRegistro">Completar Registro</button>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    async function guardarRegistroVoluntario(e) {
      e.preventDefault();
      const btn = document.getElementById('btnGuardarRegistro');
      const errorDiv = document.getElementById('regErrorMsg');

      const payload = {
        nombre: document.getElementById('regNombre').value.trim(),
        email: document.getElementById('regEmail').value.trim(),
        telefono: document.getElementById('regTelefono').value.trim(),
        especialidad: document.getElementById('regEspecialidad').value,
        ubicacion: document.getElementById('regUbicacion').value.trim()
      };

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Guardando...';

      const res = await callBackend("registrarVoluntario", payload);

      if (res.status === "SUCCESS") {
        sessionStorage.setItem('userProfile', JSON.stringify(payload));
        cargarVista('perfil');
      } else {
        btn.disabled = false;
        btn.innerText = "Completar Registro";
        errorDiv.innerText = res.message || "Error al registrar voluntario.";
        errorDiv.classList.remove('d-none');
      }
    }

    /* ==========================================================================
       VISTA 3: MI PERFIL OPERATIVO
       ========================================================================== */
    function renderizarVistaPerfil(container) {
      const p = sesionUsuario;
      container.innerHTML = `
        <div class="row justify-content-center animate__animated animate__fadeIn">
          <div class="col-12 col-md-10">
            <div class="card shadow-sm border-0 mb-4">
              <div class="card-header bg-custom-brand text-white d-flex justify-content-between align-items-center py-3">
                <h5 class="mb-0 fw-bold"><i class="fa-solid fa-id-card me-2"></i>Perfil del Voluntario</h5>
                <span class="badge ${p.verificado ? 'bg-success' : 'bg-warning text-dark'}">
                  ${p.verificado ? 'Verificado' : 'En Revisión'}
                </span>
              </div>
              <div class="card-body p-4">
                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold small text-muted">Nombre</label>
                    <p class="fs-5 fw-semibold">${p.nombre || 'No registrado'}</p>
                  </div>
                  <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold small text-muted">Correo Electrónico</label>
                    <p class="fs-5 fw-semibold">${p.email || ''}</p>
                  </div>
                </div>
                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold small text-muted">Especialidad</label>
                    <p class="fs-5 fw-semibold"><span class="badge bg-info text-dark">${p.especialidad || 'General'}</span></p>
                  </div>
                  <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold small text-muted">Rol en Sistema</label>
                    <p class="fs-5 fw-semibold text-uppercase text-primary">${p.rolActivo || 'Eslabón'}</p>
                  </div>
                </div>
                <hr>
                <div class="d-flex flex-wrap gap-2 justify-content-between align-items-center">
                  <button class="btn btn-primary fw-bold" onclick="cargarVista('calendario')">
                    <i class="fa-solid fa-calendar-check me-2"></i>Ver Calendario de Guardias
                  </button>
                  <button class="btn btn-outline-danger btn-sm" onclick="cerrarSesion()">
                    <i class="fa-solid fa-right-from-bracket me-1"></i> Cerrar Sesión
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    /* ==========================================================================
       VISTA 4: CALENDARIO DE GUARDIAS OPERATIVAS
       ========================================================================== */
    async function renderizarVistaCalendario(container) {
      container.innerHTML = `
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h4 class="fw-bold text-primary mb-0"><i class="fa-solid fa-calendar-days me-2"></i>Calendario Operativo</h4>
          <button class="btn btn-outline-secondary btn-sm" onclick="cargarVista('perfil')"><i class="fa-solid fa-arrow-left me-1"></i> Volver a Perfil</button>
        </div>
        <div id="calendarLoading" class="text-center py-5">
          <div class="spinner-border text-primary" role="status"></div>
          <p class="mt-2 text-muted small">Cargando disponibilidad de guardias...</p>
        </div>
        <div id="calendarContent" class="d-none"></div>
      `;

      const data = await callBackend("obtenerCalendario", {});
      document.getElementById('calendarLoading').classList.add('d-none');
      const content = document.getElementById('calendarContent');
      content.classList.remove('d-none');

      if (data && Array.isArray(data)) {
        renderizarGridCalendario(content, data);
      } else {
        content.innerHTML = `<div class="alert alert-warning">No hay programación disponible actualmente.</div>`;
      }
    }

    function renderizarGridCalendario(container, guardias) {
      let html = `
        <div class="calendar-grid">
          <div class="calendar-header-day">Lun</div>
          <div class="calendar-header-day">Mar</div>
          <div class="calendar-header-day">Mié</div>
          <div class="calendar-header-day">Jue</div>
          <div class="calendar-header-day">Vie</div>
          <div class="calendar-header-day">Sáb</div>
          <div class="calendar-header-day">Dom</div>
      `;

      // Render simplificado de celdas
      guardias.forEach(g => {
        const disponible = g.cupos > g.ocupados;
        const badgeClass = disponible ? 'guardia-disponible' : 'guardia-llena';
        
        html += `
          <div class="calendar-day">
            <div class="calendar-day-number">${g.fecha || ''}</div>
            <a class="guardia-badge ${badgeClass}" onclick="abrirModalGuardia('${g.id}', '${g.titulo}', '${g.cupos - g.ocupados}')">
              ${g.titulo} (${g.ocupados}/${g.cupos})
            </a>
          </div>
        `;
      });

      html += `</div>`;
      container.innerHTML = html;
    }

    function abrirModalGuardia(id, titulo, disponibles) {
      const body = document.getElementById('modalGuardiaBody');
      const footer = document.getElementById('modalGuardiaFooter');

      body.innerHTML = `
        <h6><strong>Guardia:</strong> ${titulo}</h6>
        <p class="small text-muted">Cupos disponibles: <strong>${disponibles}</strong></p>
      `;

      footer.innerHTML = `
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
        ${disponibles > 0 ? `<button type="button" class="btn btn-primary" onclick="confirmarAsignacionGuardia('${id}')">Inscribirme</button>` : ''}
      `;

      const modal = bootstrap.Modal.getOrCreateInstance(document.getElementById('modalGuardia'));
      modal.show();
    }

    async function confirmarAsignacionGuardia(idGuardia) {
      const res = await callBackend("asignarGuardia", {
        email: sesionUsuario.email,
        idGuardia: idGuardia
      });

      const modal = bootstrap.Modal.getInstance(document.getElementById('modalGuardia'));
      modal.hide();

      if (res.status === "SUCCESS") {
        alert("¡Inscripción a guardia confirmada exitosamente!");
        cargarVista('calendario');
      } else {
        alert(res.message || "No se pudo realizar la asignación.");
      }
    }

    function cerrarSesion() {
      sessionStorage.clear();
      sesionUsuario = null;
      cargarVista('auth');
    }

    function verPoliticasIndependientes() {
      const body = document.getElementById('modalGuardiaBody');
      const footer = document.getElementById('modalGuardiaFooter');

      body.innerHTML = `
        <h6 class="fw-bold text-primary mb-2">Tratamiento de Datos Personales</h6>
        <p class="small text-muted">Los datos recolectados se utilizarán exclusivamente para la gestión logística de misiones humanitarias y control vial de la red de Cadena de Favores Venezuela.</p>
      `;
      footer.innerHTML = `<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Entendido</button>`;

      const modal = bootstrap.Modal.getOrCreateInstance(document.getElementById('modalGuardia'));
      modal.show();
    }
  </script>
</body>
</html>
